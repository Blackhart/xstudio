# Domain schema for this slice. Project, sequence, shot, asset, playlist, version, note.
# Field types and operators live in the ShotGrid mapping, not here.

entities:
  project:
    creatable: false
    fields:
      id:     { filter: true, set: false }
      name:   { filter: true, set: true }
      code:   { filter: true, set: true }
      status: { filter: true, set: false, show: [Active] }
      type:   { filter: true, set: false, show: [Feature Film, Episodic] }
    scope: []

  sequence:
    creatable: false
    shelf: true
    fields:
      id:                     { filter: true,  set: false }
      name:                   { filter: true,  set: true }
      description:            { filter: true,  set: false }
      status:
        filter: true
        set: false
        default_color: "#546e7a"
        colors:
          fin: "#2e7d32"
          ip: "#ef6c00"
          hld: "#6d4c41"
          rdy: "#1565c0"
          wtg: "#78909c"
          omt: "#455a64"
        labels:
          fin: Final
          ip: In Progress
          hld: On Hold
          rdy: Ready to Start
          wtg: Waiting to Start
          omt: Omit
      cut_duration_in_sec:    { filter: true,  set: false }
      estimated_frames_count: { filter: true,  set: false }
      estimated_shots_count:  { filter: true,  set: false }
      shot_count:             { filter: true,  set: false }
      sequence_order:         { filter: true,  set: false }
      shots:                  { filter: true,  set: false }
      project:                { filter: true,  set: false }
    scope: [project]

  shot:
    creatable: false
    shelf: true
    fields:
      id:                  { filter: true, set: false }
      name:                { filter: true, set: true }
      description:         { filter: true, set: false }
      status:
        filter: true
        set: false
        default_color: "#546e7a"
        colors:
          cbb: "#f9a825"
          fin: "#2e7d32"
          rtk: "#c62828"
          ip: "#ef6c00"
          rdy: "#1565c0"
          wtg: "#78909c"
          na: "#78909c"
          hld: "#6d4c41"
          omt: "#455a64"
        labels:
          cbb: CBB
          fin: Final
          rtk: Retake
          ip: In Progress
          rdy: Ready to Start
          wtg: Waiting to Start
          na: "N/A"
          hld: On Hold
          omt: Omit
      cut_duration_in_sec: { filter: true, set: false }
      cut_in:              { filter: true, set: false }
      cut_out:             { filter: true, set: false }
      cut_order:           { filter: true, set: false }
      sequence:            { filter: true, set: false }
    scope: [sequence]

  asset:
    creatable: false
    shelf: true
    fields:
      id:          { filter: true, set: false }
      name:        { filter: true, set: true }
      description: { filter: true, set: false }
      status:
        filter: true
        set: false
        default_color: "#546e7a"
        colors:
          cbb: "#f9a825"
          cmpt: "#2e7d32"
          rev: "#00838f"
          ip: "#ef6c00"
          hld: "#6d4c41"
          rdy: "#1565c0"
          wtg: "#78909c"
          omt: "#455a64"
        labels:
          cbb: CBB
          cmpt: Complete
          rev: Pending Review
          ip: In Progress
          hld: On Hold
          rdy: Ready
          wtg: Waiting to Start
          omt: Omit
      project:     { filter: true, set: false }
    scope: [project]

  playlist:
    creatable: false
    shelf: true
    fields:
      id:               { filter: true,  set: false }
      name:             { filter: true,  set: true }
      versions:         { filter: true,  set: false }
      open_notes_count: { filter: true,  set: false }
      departments:      { filter: true,  set: false }
      created_at:       { filter: true,  set: false }
      category:         { filter: true,  set: false }
      author:           { filter: true,  set: false }
    scope: [project]

  version:
    creatable: false
    shelf: true
    fields:
      id:                { filter: true,  set: false }
      name:              { filter: true,  set: true }
      image:             { filter: false, set: false, providers: [http, file] }
      author:            { filter: true,  set: false }
      created_at:        { filter: true,  set: false }
      frame_range:       { filter: true,  set: false }
      frame_count:       { filter: true,  set: false }
      description:       { filter: true,  set: false }
      client_code:       { filter: true,  set: false }
      client_reviewed:   { filter: true,  set: false }
      client_approved:   { filter: true,  set: false }
      is_latest:         { filter: true,  set: false }
      version_number:    { filter: true,  set: false }
      task:              { filter: true,  set: false }
      step:              { filter: true,  set: false }
      status:
        filter: true
        set: false
        default_color: "#546e7a"
        colors:
          wtg: "#78909c"
          rdy: "#1565c0"
          todo: "#8d6e63"
          ip: "#ef6c00"
          chk: "#1565c0"
          rtk: "#c62828"
          rtkd: "#558b2f"
          hocvfx: "#6a1b9a"
          artrev: "#5e35b1"
          dirrev: "#4527a0"
          rev: "#00838f"
          cmpt: "#2e7d32"
          dlypnd: "#ef6c00"
          dlycpt: "#2e7d32"
          cbb: "#f9a825"
          frm: "#0277bd"
          hld: "#6d4c41"
          na: "#78909c"
          omt: "#455a64"
        labels:
          wtg: Waiting to Start
          rdy: Ready
          todo: Todo
          ip: In Progress
          chk: To Check
          rtk: Retake
          rtkd: Retake Done
          hocvfx: Pending HOCA/VFX
          artrev: Pending Art Director
          dirrev: Pending Director
          rev: Pending Review
          cmpt: Complete
          dlypnd: Delivery Pending
          dlycpt: Delivery Complete
          cbb: CBB
          frm: On Farm
          hld: On Hold
          na: "N/A"
          omt: Omit
      artistic_status:
        filter: true
        set: false
        default_color: "#546e7a"
        colors:
          wtg: "#78909c"
          rdy: "#1565c0"
          todo: "#8d6e63"
          ip: "#ef6c00"
          chk: "#1565c0"
          rtk: "#c62828"
          rtkd: "#558b2f"
          hocvfx: "#6a1b9a"
          artrev: "#5e35b1"
          dirrev: "#4527a0"
          rev: "#00838f"
          cmpt: "#2e7d32"
          atfn: "#2e7d32"
          dlypnd: "#ef6c00"
          dlycpt: "#2e7d32"
          cbb: "#f9a825"
          frm: "#0277bd"
          hld: "#6d4c41"
          na: "#78909c"
          omt: "#455a64"
        labels:
          wtg: Waiting to Start
          rdy: Ready
          todo: Todo
          ip: In Progress
          chk: To Check
          rtk: Retake
          rtkd: Retake Done
          hocvfx: Pending HOCA/VFX
          artrev: Pending Art Director
          dirrev: Pending Director
          rev: Pending Review
          cmpt: Complete
          atfn: Autofinal
          dlypnd: Delivery Pending
          dlycpt: Delivery Complete
          cbb: CBB
          frm: On Farm
          hld: On Hold
          na: "N/A"
          omt: Omit
      sites:             { filter: true,  set: false }
      notes:             { filter: true,  set: false }
      open_notes:        { filter: true,  set: false }
      open_notes_count:  { filter: false, set: false }
      synced_to_client:  { filter: true,  set: false }
      work_source_scene: { filter: true,  set: false }
      frames:            { filter: false, set: false, providers: [fileSeq] }
      movie:             { filter: false, set: false, providers: [file] }
      uploaded_movie:    { filter: false, set: false, providers: [signedurl] }
      playlists:         { filter: true,  set: false }
      project:           { filter: true,  set: false }
      entity:            { filter: true,  set: false }
    scope: [shot, sequence, asset, playlist]

  note:
    creatable: false
    shelf: false
    fields:
      id:         { filter: true, set: false }
      name:       { filter: true, set: false }
      content:    { filter: true, set: false }
      author:     { filter: true, set: false }
      created_at: { filter: true, set: false }
      status:
        filter: true
        set: false
        default_color: "#546e7a"
        colors:
          clsd: "#546e7a"
          cmpt: "#2e7d32"
          artrev: "#5e35b1"
          rev: "#00838f"
          rtkd: "#558b2f"
          rtk: "#c62828"
          chk: "#1565c0"
          ip: "#ef6c00"
          opn: "#f9a825"
          hld: "#6d4c41"
        labels:
          clsd: Closed
          cmpt: Complete
          artrev: Pending Art Director
          rev: Pending Review
          rtkd: Retake Done
          rtk: Retake
          chk: To Check
          ip: In Progress
          opn: Open
          hld: On Hold
      to:          { filter: true, set: false }
      department:  { filter: true, set: false }
      attachments: { filter: true, set: false }
    scope: [version]
