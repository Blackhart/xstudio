# Domain schema for this slice. Project, sequence, shot, asset, playlist, version.
types:
  string: { ops: [eq, ne] }
  int:    { ops: [eq, ne] }
  date:   { ops: [eq, ne] }

entities:
  project:
    creatable: false
    fields:
      id:   { type: int,    filter: true, set: false }
      name: { type: string, filter: true, set: true }
      code: { type: string, filter: true, set: true }
    scope: []

  sequence:
    creatable: false
    fields:
      id:   { type: int,    filter: true, set: false }
      name: { type: string, filter: true, set: true }
    scope: [project]

  shot:
    creatable: false
    fields:
      id:   { type: int,    filter: true, set: false }
      name: { type: string, filter: true, set: true }
    scope: [sequence]

  asset:
    creatable: false
    fields:
      id:   { type: int,    filter: true, set: false }
      name: { type: string, filter: true, set: true }
    scope: [project]

  playlist:
    creatable: false
    fields:
      id:   { type: int,    filter: true, set: false }
      name: { type: string, filter: true, set: true }
    scope: [project]

  version:
    creatable: false
    fields:
      id:    { type: int,    filter: true, set: false }
      name:  { type: string, filter: true, set: true }
      image: { type: string, filter: false, set: false, providers: [http, file] }
    scope: [shot, sequence, asset, playlist]
