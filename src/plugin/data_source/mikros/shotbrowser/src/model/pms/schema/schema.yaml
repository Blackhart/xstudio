# Domain schema for this slice. Project, sequence, shot, asset, playlist, version.
types:
  string: { ops: [eq, ne] }
  int:    { ops: [eq, ne] }
  date:   { ops: [eq, ne] }

entities:
  project:
    creatable: false
    fields:
      id:   { type: int,    filter: true, set: false }
      name: { type: string, filter: true, set: true }
      code: { type: string, filter: true, set: true }
    scope: []

  sequence:
    creatable: false
    fields:
      id:   { type: int,    filter: true, set: false }
      name: { type: string, filter: true, set: true }
    scope: [project]

  shot:
    creatable: false
    fields:
      id:   { type: int,    filter: true, set: false }
      name: { type: string, filter: true, set: true }
    scope: [sequence]

  asset:
    creatable: false
    fields:
      id:   { type: int,    filter: true, set: false }
      name: { type: string, filter: true, set: true }
    scope: [project]

  playlist:
    creatable: false
    fields:
      id:   { type: int,    filter: true, set: false }
      name: { type: string, filter: true, set: true }
    scope: [project]

  version:
    creatable: false
    fields:
      id:    { type: int,    filter: true, set: false }
      name:  { type: string, filter: true, set: true }
      image: { type: string, filter: false, set: false, providers: [http, file] }
      author:           { type: string, filter: false, set: false }
      created_at:       { type: string, filter: false, set: false }
      frame_range:      { type: string, filter: false, set: false }
      description:      { type: string, filter: false, set: false }
      step:             { type: string, filter: false, set: false }
      status:           { type: string, filter: false, set: false }
      artistic_status:  { type: string, filter: false, set: false }
      sites:            { type: string, filter: false, set: false }
      has_notes:        { type: int,    filter: false, set: false }
      synced_to_client: { type: int,    filter: false, set: false }
      frames:           { type: string, filter: false, set: false, providers: [fileSeq] }
      movie:            { type: string, filter: false, set: false, providers: [file] }
      uploaded_movie:   { type: string, filter: false, set: false, providers: [url] }
    scope: [shot, sequence, asset, playlist]
